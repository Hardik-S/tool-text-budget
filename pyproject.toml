[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-text-budget"
version = "0.1.0"
description = "Offline byte-budget checks for normalized tool text fixtures"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hardik-S"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tool-text-budget = "tool_text_budget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
